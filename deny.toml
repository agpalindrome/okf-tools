# cargo-deny configuration, from the shared defaults in ~/.claude/rust.md.
# Advisories run on a schedule (.github/workflows/advisories.yml); bans,
# licenses and sources run inside `nix flake check` (`checks.deny` in
# flake.nix). `cargo deny check all` from the dev shell runs all four.

[advisories]
# Transitive unmaintained crates are as unactionable as duplicate versions.
# Today that scope covers RUSTSEC-2024-0449 (unsafe-libyaml, via serde_yaml):
# the archived serde_yaml is a deliberate choice, argued in each crate's
# Cargo.toml, so the notice is accepted rather than hidden by accident.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0",           # unicode-ident, reached transitively by ~everything
    "MPL-2.0",               # file-level copyleft; does not infect linked code
    "CDLA-Permissive-2.0",   # webpki-roots — the Mozilla CA bundle, so anything
                             # doing TLS reaches it (rustls, ureq, reqwest, …)
]
confidence-threshold = 0.8
# The allowlist is anticipatory — "acceptable here", not "present today" — so an
# entry matching nothing in the tree is normal and warning about it is noise.
unused-allowed-license = "allow"
# Skips crates that are `publish = false` (deon). A third party's proprietary
# crate arriving from a registry is still rejected.
private = { ignore = true }

[bans]
multiple-versions = "warn"   # same unactionability that allowed clippy's lint
wildcards = "deny"           # matches clippy's denied wildcard_dependencies
allow-wildcard-paths = true  # ...but not for internal path deps
deny = []

[sources]
unknown-registry = "deny"    # template default is "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
