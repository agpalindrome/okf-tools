name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to the same branch supersede in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast hygiene hooks: nixfmt, deadnix, statix, markdownlint, check-yaml,
  # and whitespace/EOF — exactly the local hook set, so CI == `nix flake
  # check` (one source of truth). This is deon's founding required-status leg;
  # the Rust checker's fmt/clippy/test gate joins it when the checker lands.
  hooks:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check -L

  # The one check the ruleset requires (#117). It names no work, so the job
  # above can be renamed, split or extended without touching branch
  # protection. `always()` makes it run when `hooks` fails; testing for
  # `success` rather than against `failure` keeps a skipped or cancelled
  # `hooks` from passing as green, which is how a required check that is
  # skipped would otherwise read.
  ci:
    name: ci
    needs: [hooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.hooks.result }}" = success
