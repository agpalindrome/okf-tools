StylesPath = .vale/styles
MinAlertLevel = suggestion

# Rustdoc comments are markdown, and vale does not treat them as such on its
# own: it extracts `///` and `//!` correctly but then lints their backticked
# literals as prose. This alias makes it parse the extracted comments as
# markdown, so code spans are skipped. It is inert until a repo adds its own
# `[*.rs]` section below the repo-local marker at the end of this file — see
# `vale/README.md` in agpalindrome/claude.
[formats]
rs = md

[*.md]
BasedOnStyles = Prose

# A blockquote holds text being examined rather than asserted — a specimen, an
# error message, or someone else's words (prose.md, "A blockquote is for text
# being examined rather than asserted"). Nobody may correct a quotation, so
# linting one leaves three moves and two of them falsify the citation: reword
# the source, truncate it, or suppress the rule by hand at every quotation. So
# every rule is skipped inside a blockquote.
#
# This is BlockIgnores rather than a `scope:` on each rule, because vale's
# blockquote scope reaches only the first block inside the quote. Measured
# 2026-08-16 with vale 3.17.0 — under `scope: ~blockquote`, a second paragraph,
# a second list item, text following a quoted heading, and a blockquote nested
# in a list item were all still linted. See `vale/README.md` in agpalindrome/claude.
#
# **When an ignored blockquote contains a match, that rule reports exactly one
# alert for that match text in the whole file, at the blockquote's line.** Every
# other occurrence of the same text collapses into it. Measured 2026-09-15 with
# vale 3.17.1: a quotation holding `just` plus three ordinary prose lines
# holding `just` reported one alert at the quotation's line, where removing
# `BlockIgnores` reported four. An error-level rule behaves identically —
# `SpellingIze` against a quotation plus three prose `organise` reported one
# instead of four.
#
# **The blockquote's own alert is correctly suppressed, and the survivor is a
# prose one wearing the wrong line number.** Deleting the match from the prose
# line, leaving the quotation's untouched, leaves no alert at all — so the
# thing printed against the quotation was never the quotation's.
#
# **Read the exposure precisely, because it is narrower than "an error can be
# swallowed" and wider than "nothing is lost".** At least one alert always
# survives, so the gate still fails and nothing ships past it. What is lost is
# the count and the locations: N occurrences report as one, pointing at a line
# the author must not change. `Condescending`, `Intensifiers` and `SpellingIze`
# are `existence` rules at `level: error`, so this reaches blocking rules.
#
# Four things were ruled out, each by reproducing the fault without them: the
# rule's `exceptions`, its `level`, `<!-- vale off -->` as a workaround, and the
# blockquote itself — a quotation carrying no match leaves later alerts correct.
# It tracks the rule's type, `existence` being affected where `substitution` is
# not.
#
# The owner decided on 2026-09-15 to keep the exemption, because linting a
# quotation is the fault this setting exists to prevent. agpalindrome/claude#86
# and #87 carry the working; nothing has been checked against vale upstream.
#
# That account holds for 3.17.1 and no later release: on 2026-10-26 the
# seven-line reproducer in #87 reported at the word it matched on every release
# binary from 3.18.0 to 3.25.1. See `vale/README.md` in agpalindrome/claude.
BlockIgnores = (?m)^ *>.*$

