StylesPath = .vale/styles
MinAlertLevel = suggestion

# Rustdoc comments are markdown, and vale does not treat them as such on its
# own: it extracts `///` and `//!` correctly but then lints their backticked
# literals as prose. This alias makes it parse the extracted comments as
# markdown, so code spans are skipped. It is inert until a repo adds its own
# `[*.rs]` section below the repo-local marker at the end of this file — see
# `vale/README.md` in agpalindrome/claude.
[formats]
rs = md

[*.md]
BasedOnStyles = Prose

# A blockquote holds text being examined rather than asserted — a specimen, an
# error message, or someone else's words (prose.md, "A blockquote is for text
# being examined rather than asserted"). Nobody may correct a quotation, so
# linting one leaves three moves and two of them falsify the citation: reword
# the source, truncate it, or suppress the rule by hand at every quotation. So
# every rule is skipped inside a blockquote.
#
# This is BlockIgnores rather than a `scope:` on each rule, because vale's
# blockquote scope reaches only the first block inside the quote. Measured
# 2026-08-16 with vale 3.17.0 — under `scope: ~blockquote`, a second paragraph,
# a second list item, text following a quoted heading, and a blockquote nested
# in a list item were all still linted. See `vale/README.md` in agpalindrome/claude.
BlockIgnores = (?m)^ *>.*$

